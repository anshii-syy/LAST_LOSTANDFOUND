<div class="table-a">
    <h4 class="table-title">Displaying The Most Recent Lost Items</h4>

        <thead>
            <tr>
                <th>Item Name</th>

                <th>Time Found</th>

<!-- DATABASE TO!!-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseClient = createClient(
    'https://xcuyfajikizhaxhvgwdp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjdXlmYWppa2l6aGF4aHZnd2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU5NDMsImV4cCI6MjEwMzMxMTk0M30.TkbHcHlOfREeRWkedrcfiKznpd3t8urT05hU6tZ5Bm8'
  );

    async function loadRecentItems() {
    const { data, error } = await supabaseClient
      .from('FOUND ITEMS')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: false })
      .limit(10);

    if (error) {
      console.error(error);
      return;
    }

    const tbody = document.getElementById('recentItemsBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3">No items reported yet.</td></tr>';
      return;
    }

    data.forEach(item => {
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${item.item_name}</td>
        <td>${item.date}</td>
        <td>${item.time}</td>
      `;
    });
}

loadRecentItems();


</script>
</body>
