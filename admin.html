<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICS Lost & Found Portal</title>
    <link rel="stylesheet" href="admin_css.css">
</head>

<body>

    <div id="grid">

        <div class="profile">
            <h2>AICS Admin</h2>

            <div class="nav">
                <a href="admin.html"><button class="active">Dashboard</button></a>
                <a href="admin_claim.html"><button>Claim Requests</button></a>
                <a href="admin_report.html"><button>Lost Reports</button></a>
                <a href="users.html"><button>Verified Users</button></a>
                <a href="archive.html"><button>Archive</button></a>
            </div>

            <div class="logout-wrap">
                <a href="index.html"><button>Logout</button></a>
            </div>
        </div>

        <div class="content">
            <h1>Dashboard</h1>

            <div class="box">
                <div class="box-a found">
                    <div>
                        <div class="number" id="foundCount">0</div>
                        <div class="box-title">Found</div>
                    </div>
                    <div class="box-icon">📦</div>
                </div>

                <div class="box-a claimed">
                    <div>
                        <div class="number" id="claimedCount">0</div>
                        <div class="box-title">Claimed</div>
                    </div>
                    <div class="box-icon">✅</div>
                </div>

                <div class="box-a pending">
                    <div>
                        <div class="number" id="pendingCount">0</div>
                        <div class="box-title">Pending</div>
                    </div>
                    <div class="box-icon">⏳</div>
                </div>
            </div>

            <div class="table-a">
                <h4 class="table-title">Recent Reports</h4>

                <table class="table">
                    <thead>
    <tr>
        <th>Item Name</th>
        <th>Reported By</th>
        <th>Time</th>
        <th>Status</th>
    </tr>
</thead>
</thead>
                    <tbody>
                        <!-- rows go here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(
         'https://xcuyfajikizhaxhvgwdp.supabase.co',
         'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjdXlmYWppa2l6aGF4aHZnd2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU5NDMsImV4cCI6MjEwMzMxMTk0M30.TkbHcHlOfREeRWkedrcfiKznpd3t8urT05hU6tZ5Bm8'

        );

        async function loadDashboardStats() {
            const { count: foundCount, error: foundError } = await supabaseClient
                .from('FOUND ITEMS')
                .select('*', { count: 'exact', head: true });

            const { count: pendingCount, error: pendingError } = await supabaseClient
                .from('FOUND ITEMS')
                .select('*', { count: 'exact', head: true })
                .eq('status', 'pending');

            const { count: claimedCount, error: claimedError } = await supabaseClient
                .from('CLAIM_ARCHIVE')
                .select('*', { count: 'exact', head: true })
                .eq('result', 'approved');

            if (foundError || pendingError || claimedError) {
                console.error('Error loading stats:', foundError || pendingError || claimedError);
                return;
            }

            document.getElementById('foundCount').textContent = foundCount ?? 0;
            document.getElementById('pendingCount').textContent = pendingCount ?? 0;
            document.getElementById('claimedCount').textContent = claimedCount ?? 0;
        }

        loadDashboardStats();

      async function loadRecentReports() {
    const { data, error } = await supabaseClient
        .from('FOUND ITEMS')
        .select('id, item_name, fullname, time, status')
        .eq('status', 'pending')
        .order('created_at', { ascending: false })
        .limit(5);

    if (error) {
        console.error('Error loading recent reports:', error);
        return;
    }

    const tbody = document.querySelector('.table tbody');
    tbody.innerHTML = '';

    data.forEach(report => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${report.item_name}</td>
            <td>${report.fullname}</td>
            <td>${report.time}</td>
            <td>${report.status}</td>
        `;
        tbody.appendChild(row);
    });
}

loadRecentReports();

    </script>
</body>
</html>
