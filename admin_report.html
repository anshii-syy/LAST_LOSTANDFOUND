<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Reports</title>
</head>
<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f7fa;
}

#grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
}

/* sidebar */
.profile {
    background-color: #1F3A5F;
    color: white;
    display: flex;
    flex-direction: column;
    padding: 0;
}

.profile h2 {
    padding: 20px;
    margin: 0;
    font-size: 20px;
    font-weight: bold;
    background-color: #16293f; 
}

.nav {
    display: flex;
    flex-direction: column;
    margin-top: 10px;
}

.nav a {
    color: #cfd9e6;
    text-decoration: none;
}

.nav button {
    width: 100%;
    text-align: left;
    padding: 14px 20px;
    border: none;
    background: transparent;
    color: #cfd9e6;
    font-size: 15px;
    cursor: pointer;
}

.nav button:hover {
    background-color: #2a4a75;
    color: white;
}

.nav button.active {
    background-color: #ffffff;
    color: #1F3A5F;
    font-weight: bold;
}

/* labas ng table */
.table-a {
    padding: 20px;
    background-color: #ffffff;
    
}

.table-title {
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 18px;
    color: #040000;
    font-weight: bold;
}

.table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.table th,
.table td {
  padding: 14px 16px;
  text-align: center;
  border-bottom: 1px solid #ddd;
  word-wrap: break-word;
}

.table th {
  background: #2b7a9e; 
  color: white;
}

.table td {
  background: #fff;
}

.status-pending {
    color: #e6a817;
    font-weight: bold;
}

.status-done {
    color: #2e7d32;
    font-weight: bold;
}

.done-btn {
    background-color: #2b7a9e;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
}

.done-btn:hover {
    background-color: #1F3A5F;
}

.done-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

.empty-row td {
    color: #888;
    padding: 20px;
}

</style>
<body>
    <div id="grid">
        <div class="profile">
            <h2>AICS Admin</h2>

            <div class="nav">
               <a href="admin.html"><button>Dashboard</button></a>
                <a href="admin_claim.html"><button>Claim Requests</button></a>
                <a href="admin_report.html"><button class="active">Lost Reports</button></a>
                <a href="users.html"><button>Verified Users</button></a>
                <a href="archive.html"><button>Archive</button></a>
            </div>

            <div style="margin-top:auto; padding: 20px;">
                <a href="index.html"><button>Logout</button></a>
            </div>
        </div>

        <!-- main content -->
        <div class="table-a">
            <h4 class="table-title">Lost Reports</h4>

            <table class="table">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Reported By</th>
                        <th>Section</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="reportsBody">
                    <tr class="empty-row"><td colspan="8">Loading...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(
            'https://xcuyfajikizhaxhvgwdp.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjdXlmYWppa2l6aGF4aHZnd2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU5NDMsImV4cCI6MjEwMzMxMTk0M30.TkbHcHlOfREeRWkedrcfiKznpd3t8urT05hU6tZ5Bm8'
        );

        async function loadLostReports() {
            const tbody = document.getElementById('reportsBody');

            const { data, error } = await supabaseClient
                .from('FOUND ITEMS')
                .select('id, item_name, "Description", date, time, fullname, section, status')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading lost reports:', error);
                tbody.innerHTML = `<tr class="empty-row"><td colspan="8">Failed to load reports.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="8">No reports found.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';

            data.forEach(report => {
                const isDone = report.status === 'done';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${report.item_name ?? ''}</td>
                    <td>${report.Description ?? ''}</td>
                    <td>${report.date ?? ''}</td>
                    <td>${report.time ?? ''}</td>
                    <td>${report.fullname ?? ''}</td>
                    <td>${report.section ?? ''}</td>
                    <td class="${isDone ? 'status-done' : 'status-pending'}">${report.status ?? 'pending'}</td>
                    <td>
                        <button
                            class="done-btn"
                            ${isDone ? 'disabled' : ''}
                            onclick="markAsDone(${report.id}, this)"
                        >
                            ${isDone ? 'Done' : 'Mark as Done'}
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function markAsDone(reportId, btn) {
            btn.disabled = true;
            btn.textContent = 'Updating...';

            const { error } = await supabaseClient
                .from('FOUND ITEMS')
                .update({ status: 'done' })
                .eq('id', reportId);

            if (error) {
                console.error('Error updating status:', error);
                alert('Failed to update item.');
                btn.disabled = false;
                btn.textContent = 'Mark as Done';
                return;
            }

            // refresh the table so the row/status/button updates
            loadLostReports();
        }

        loadLostReports();
    </script>
</body>
</html>
