<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Object Form</title>
<style>

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: #8fc0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .head-bg {
    background: #fff;
    width: 100%;
    max-width: 700px;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .head-h {
    background: #1f3d70;
    padding: 28px 32px;
    text-align: center;
  }

  .head-h h1 {
    color: #fff;
    margin: 0;
    font-size: 28px;
    font-weight: 700;
  }

  form {
    padding: 32px;
  }

  .row {
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
  }

  .field {
    flex: 1;
    margin-bottom: 24px;
  }

  .row .field {
    margin-bottom: 0;
  }

  label {
    display: block;
    color: #1f3d70;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  label .required {
    color: #d92d20;
  }

  input[type="text"],
  input[type="date"],
  input[type="time"],
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #4a6fa5;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    color: #333;
    background: #fff;
  }

  input::placeholder {
    color: #b0b0b0;
  }

  textarea {
    min-height: 120px;
    resize: vertical;
  }

  button[type="submit"] {
    background: #1f3d70;
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button[type="submit"]:hover {
    background: #16294d;
  }

  .message {
    display: none;
    background: #e6f4ea;
    border: 1px solid #34a853;
    color: #1e7e34;
    padding: 14px 18px;
    border-radius: 4px;
    margin-bottom: 24px;
    font-size: 14px;
  }

</style>
</head>
<body>

<div class="head-bg">
  <div class="head-h">
    <h1>Found Property Intake Form</h1>
  </div>

  <form id="lostObjectForm">
    <div class="message" id="successMsg">Your report has been submitted.</div>

    <div class="field">
      <label for="name">Name <span class="required">*</span></label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="field">
      <label for="section">Section<span class="required">*</span></label>
      <input type="text" id="section" name="section" placeholder="e.g. BS3MA" required>
    </div>


    <div class="field">
      <label for="itemName">Item Name <span class="required">*</span></label>
      <input type="text" id="itemName" name="itemName" placeholder="e.g. Black backpack" required>
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Describe the item and where it was found"></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="date">Date <span class="required">*</span></label>
        <input type="date" id="date" name="date" required>
      </div>
      
      <div class="field">
        <label for="time">Time <span class="required">*</span></label>
        <input type="time" id="time" name="time" required>
      </div>
    </div>

    <button type="submit">Submit</button>
  </form>
</div>

<!-- DATABASE!!-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const supabaseClient = createClient(
    'https://xcuyfajikizhaxhvgwdp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjdXlmYWppa2l6aGF4aHZnd2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU5NDMsImV4cCI6MjEwMzMxMTk0M30.TkbHcHlOfREeRWkedrcfiKznpd3t8urT05hU6tZ5Bm8'
  );

  const form = document.getElementById('lostObjectForm');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const sure = confirm("Are you sure you want to submit it?");
    if (!sure) {
      return;
    }

   const itemName = document.getElementById('itemName').value;
   const date = document.getElementById('date').value;
   const time = document.getElementById('time').value;
   const description = document.getElementById('description').value;  
   const fullname = document.getElementById('name').value;             
   const section = document.getElementById('section').value;

   const { data: userData, error: userError } = await supabaseClient.auth.getUser();

   if (userError || !userData.user) {
     alert('You must be logged in to submit a report.');
     return;
   }

    const { error } = await supabaseClient
    .from('FOUND ITEMS')  
    .insert({
    fullname: fullname,
    item_name: itemName,
    Description: description,
    date: date,
    time: time,
    section: section,
    user_id: userData.user.id

      });

    if (error) {
      console.error(error);
      alert('Something went wrong..');
      return;
    }

    successMsg.style.display = 'block';
    successMsg.scrollIntoView({ behavior: 'smooth', block: 'start' });
    form.reset();
    window.location.href = "Website.html";
  });
</script>
</body>
</html>
